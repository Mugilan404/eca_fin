<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elumalai's Chemistry Academy | Create Test</title>

  <link rel="stylesheet" href="create_test.css" />
  <link rel="icon" href="img/logo.png" type="image/x-icon" />
</head>

<body>

<!-- ===== Header ===== -->
<header>
  <nav class="navbar">
    <div class="logo">
      <img src="img/logo.png" alt="Logo">
      <span>Elumalai's Chemistry Academy</span>
    </div>

    <button class="menu-toggle" onclick="toggleMenu()">☰</button>

    <ul class="nav-links" id="navLinks">
      <li><a href="admin_dashboard.html">Dashboard</a></li>
      <li><a href="create-batch.html">Create Batch</a></li>
      <li><a class="active" href="#">Create Test</a></li>
      <li><a href="student-login.html">Logout</a></li>
    </ul>
  </nav>
</header>

<!-- ===== Create Class Form ===== -->
<div class="auth-container">
  <div class="auth-box">
    <h2>Create Class</h2>

    <form id="createClassForm">

      <!-- Batch -->
      <div class="form-group">
        <label>Select Class Batch</label>
        <select id="batch_id" required>
          <option value="">-- Loading Batches... --</option>
        </select>
      </div>

      <!-- Topic -->
      <div class="form-group">
        <label>Class Topic</label>
        <input type="text" id="topic" required />
      </div>

      <!-- Date -->
      <div class="form-group">
        <label>Class Date</label>
        <input type="date" id="class_date" required />
      </div>

      <!-- Time -->
      <div class="form-group">
        <label>Class Time</label>
        <input type="text" id="class_time" placeholder="6:00 PM - 7:30 PM" required />
      </div>

      <!-- Meeting Link -->
      <div class="form-group">
        <label>Join Class Link</label>
        <input type="url" id="joinclass" placeholder="https://meet.google.com/..." required />
      </div>

      <button type="submit" class="btn">Create Class</button>

      <p id="message"></p>

    </form>
  </div>
</div>

<footer>
  <p> For Queries, contact: 9840608224 | Email: elumalaiphd@gmail.com</p>
  © 2026 Elumalai's Chemistry Academy. All Rights Reserved.
</footer>

<script>
/* ===== Mobile Menu ===== */
function toggleMenu() {
  document.getElementById("navLinks").classList.toggle("show");
}

/* ===== Load Batches ===== */
async function loadBatches() {
  try {
    const res = await fetch("/api/batch/classes", {
      headers: {
        Authorization: "Bearer " + localStorage.getItem("token")
      }
    });

    const data = await res.json();
    const select = document.getElementById("batch_id");

    select.innerHTML = `<option value="">-- Select Batch --</option>`;

    data.batches.forEach(batch => {
      const option = document.createElement("option");
      option.value = batch.batch_id;
      option.textContent = batch.batch_name;
      select.appendChild(option);
    });

  } catch (err) {
    alert("Failed to load batches");
  }
}

/* ===== Create Class ===== */
document.getElementById("createClassForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const msg = document.getElementById("message");
  msg.innerText = "Creating class...";
  msg.style.color = "black";

  const payload = {
    batch_id: document.getElementById("batch_id").value,
    topic: document.getElementById("topic").value,
    class_date: document.getElementById("class_date").value,
    class_time: document.getElementById("class_time").value,
    joinclass: document.getElementById("joinclass").value
  };

  try {
    const res = await fetch("/api/classes/create", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        Authorization: "Bearer " + localStorage.getItem("token")
      },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if (!data.success) {
      msg.style.color = "red";
      msg.innerText = data.message || "Failed to create class";
      return;
    }

    msg.style.color = "green";
    msg.innerText = "✅ Class created successfully";
    window.location.href = "admin_dashboard.html";
    document.getElementById("createClassForm").reset();

  } catch (err) {
    console.error(err);
    msg.style.color = "red";
    msg.innerText = "Server error while creating class";
  }
});

/* ===== Init ===== */
loadBatches();
</script>

</body>
</html>
