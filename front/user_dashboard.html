<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Elumalai's Chemistry Academy | User Dashboard</title>

  <link rel="stylesheet" href="user_dashboard.css">
  <link rel="icon" href="img/logo.png" type="image/x-icon">
</head>

<!-- Popup Modal -->
<div id="popupModal" style="display:block;">
  <div id="popupOverlay"></div>
  <div id="popupContent" style="display:none;">
    <a id="popupLink" href="#" target="_blank">
      <img id="popupImage" src="" alt="Popup" />
    </a>
    <button id="popupClose">&times;</button>
  </div>
</div>

<body>

<!-- 🔹 Header -->
<header>
  <nav class="navbar">
    <div class="logo">
      <img src="img/logo.png" alt="Logo">
      <span>Elumalai's Chemistry Academy</span>
    </div>

    <span class="menu-toggle" id="menu-toggle">&#9776;</span>

    <ul class="nav-links" id="nav-links">
      <li><a href="user_dashboard.html" class="active">Dashboard</a></li>
      <li><a href="study_materials.html">Study Materials</a></li>
        <li><a href="online_test.html">Online Test</a></li>
        <li><a href="online_class.html">Online Class</a></li>
      <li><a href="student-login.html" id="logoutBtn">Logout</a></li>
    </ul>
  </nav>
</header>
<!-- 🔔 Sliding Notifications -->
  <div class="notification-bar">
    <marquee id="topNotifications" behavior="scroll" direction="left"></marquee>
  </div>
<!-- 🔹 Main Dashboard -->
<main class="dashboard-container">

  <!-- 📦 Accessible Batches -->
  <section class="card">
    <h2>My Batches</h2>
    <div id="batchContainer" class="grid"></div>
    <p id="batchError" class="error-msg"></p>
  </section>

  <!-- 📊 Previous Test Scores -->
  <section class="card">
    <h2>My Test History</h2>

    <table>
      <thead>
        <tr>
          <th>Test Name</th>
          <th>Score</th>
          <th>Correct</th>
          <th>Time</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="scoreTable"></tbody>
    </table>

    <p id="testError" class="error-msg"></p>
  </section>

</main>

<!-- 🔹 Footer -->
<footer>
  <p> For Queries, contact: 9840608224 | Email: elumalaiphd@gmail.com</p>
  <p>© 2026 Elumalai's Chemistry Academy. All rights reserved.</p>
</footer>

<script>
// Popup Notification
document.addEventListener("DOMContentLoaded", async () => {
  // Check if popup was already closed in this session
  /*if (localStorage.getItem("popupClosed") === "true") {
    document.getElementById("popupModal").style.display = "none";
    return;
  }*/

  try {
    const res = await fetch("/api/notifications/get-popup");
    const data = await res.json();
    const popupModal = document.getElementById("popupModal");
    const popupImage = document.getElementById("popupImage");
    const popupLink = document.getElementById("popupLink");

    if (data.success && data.popup) {
      popupImage.src = data.popup.img_path;
      popupLink.href = data.popup.redirect_url || "#";

      // Show the popup content
      document.getElementById("popupContent").style.display = "block";

      // Close button
      document.getElementById("popupClose").addEventListener("click", () => {
        popupModal.style.display = "none";
        localStorage.setItem("popupClosed", "true");
      });
    } else {
      popupModal.style.display = "none";
    }
  } catch (err) {
    console.error("Failed to load popup:", err);
    document.getElementById("popupModal").style.display = "none";
  }
});

/* =============================
   MOBILE MENU
============================= */
const menuToggle = document.getElementById("menu-toggle");
const navLinks = document.getElementById("nav-links");

menuToggle.addEventListener("click", () => {
  navLinks.classList.toggle("show");
});

/* =============================
   FETCH USER BATCHES
============================= */
async function loadBatches() {
  try {
    const res = await fetch("/api/batch/my-batches", {
      headers: {
        Authorization: "Bearer " + localStorage.getItem("token")
      }
    });

    if (res.status === 401 || res.status === 403) {
      alert("Session expired. Please login again.");
      localStorage.clear();
      window.location.href = "student-login.html";
      return;
    }

    if (!res.ok) throw new Error();

    const data = await res.json();
    const container = document.getElementById("batchContainer");

    if (data.batches.length === 0) {
      container.innerHTML = "<p>No batches purchased yet.Take a look at available batches.</p><p><a href='study_materials.html'>Study Materials</a> | <a href='online_test.html'>Online Tests</a> | <a href='online_class.html'>Online Classes</a></p>";
      return;
    }
    data.batches.forEach(batch => {
      container.innerHTML += `
        <div class="batch-card">
          <h3>${batch.batch_name}</h3>
          <p>Type: ${batch.batch_for}</p>
          <p>Price: ₹${batch.batch_price}</p>
          <button onclick="openBatch(${batch.batch_id}, '${batch.batch_for}')">View</button>
        </div>
      `;
    });

  } catch {
    document.getElementById("batchError").innerText =
      "⚠ Error loading batches. Please try again later.";
  }
}
fetch("/api/notifications/top3")
    .then(res => res.json())
    .then(data => {
      if (!data.success) return;

      const container = document.getElementById("topNotifications");

      if (!data.notifications.length) {
        container.innerHTML = "<span>No notifications</span>";
        return;
      }

      container.innerHTML = data.notifications
        .map(n => `
          <a href="${n.url || '#'}" target="_blank">
            ${n.description}
          </a>
        `)
        .join(" | ");
    })
    .catch(err => console.error("Top 3 fetch error:", err));


/* =============================
   FETCH TEST HISTORY
============================= */
async function loadTestHistory() {
  try {
    const res = await fetch("/api/attempts/my-attempts", {
      headers: {
        Authorization: "Bearer " + localStorage.getItem("token")
      }
    });

    if (res.status === 401 || res.status === 403) {
      alert("Session expired. Please login again.");
      localStorage.clear();
      window.location.href = "student-login.html";
      return;
    }

    if (!res.ok) throw new Error();

    const data = await res.json();
    const table = document.getElementById("scoreTable");

    if (data.attempts.length === 0) {
      table.innerHTML =
        "<tr><td colspan='5'>No test attempts found.</td></tr>";
      return;
    }

    data.attempts.forEach(t => {
      table.innerHTML += `
        <tr>
          <td>${t.test_name}</td>
          <td>${t.score}</td>
          <td>${t.score}/${t.total_questions}</td>
          <td>${new Date(t.completed_at).toLocaleString()}</td>
          <td>
            <a
              href="results.html?attempt_id=${t.attempt_id}"
              class="view-btn"
            >
              View Result
            </a>
          </td>
        </tr>
      `;
    });

  } catch {
    document.getElementById("testError").innerText =
      "⚠ Error loading test history.";
  }
}

/* =============================
   OPEN BATCH
============================= */
function openBatch(batchId, type) {
  if (type === "Materials") {
    window.location.href = `materials.html?batch_id=${batchId}`;
  } else if (type === "Tests") {
    window.location.href = `testlist.html?batch_id=${batchId}`;
  } else if (type === "Classes") {
    window.location.href = `ClassDetails.html?batch_id=${batchId}`;
  }
}


/* =============================
   LOGOUT
============================= */
document.getElementById("logoutBtn").addEventListener("click", () => {
  localStorage.clear();
});

/* =============================
   INIT
============================= */
loadBatches();
loadTestHistory();
</script>

</body>
</html>
