<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elumalai's Chemistry Academy | Delete Class</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="grant_access.css">
    <link rel="icon" href="img/logo.png" type="image/x-icon">
</head>
<body>

<!-- ===== Header ===== -->
<header>
    <nav class="navbar">
        <div class="logo">
            <img src="img/logo.png" alt="ECA Logo">
            <span>Elumalai's Chemistry Academy</span>
        </div>

        <button class="menu-toggle" onclick="toggleMenu()">☰</button>

        <ul class="nav-links" id="navLinks">
            <li><a href="admin_dashboard.html">Dashboard</a></li>
            <li><a href="create-batch.html">Create Batch</a></li>
            <li><a href="grant_access.html">Grant Access</a></li>
            <li><a class="active" href="#">Delete Class</a></li>
            <li><a href="student-login.html">Logout</a></li>
        </ul>
    </nav>
</header>

<!-- ===== Delete Class Form ===== -->
<div class="auth-container">
    <div class="auth-box">
        <h2>Delete Class</h2>

        <form id="deleteClassForm">

            <!-- Batch Dropdown -->
            <div class="form-group">
                <label>Select Batch</label>
                <select id="batchSelect" required>
                    <option value="">-- Select Batch --</option>
                </select>
            </div>

            <!-- Class Dropdown -->
            <div class="form-group">
                <label>Select Class</label>
                <select id="classSelect" required disabled>
                    <option value="">-- Select Class --</option>
                </select>
            </div>

            <button type="submit" class="btn" style="background:#dc3545">
                Delete Class
            </button>
        </form>
    </div>
</div>

<!-- ===== Footer ===== -->
<footer>
    <p> For Queries, contact: 9840608224 | Email: elumalaiphd@gmail.com</p>
    © 2026 Elumalai's Chemistry Academy. All Rights Reserved.
</footer>

<script>
/* ===== Mobile Menu ===== */
function toggleMenu() {
    document.getElementById("navLinks").classList.toggle("show");
}

let selectedBatchId = "";
let selectedClassId = "";

/* ==================================================
   FETCH ALL BATCHES ON PAGE LOAD
================================================== */
document.addEventListener("DOMContentLoaded", async () => {
    const batchSelect = document.getElementById("batchSelect");

    try {
        const res = await fetch("/api/batch/classes");
        const data = await res.json();

        if (!data.success || !data.batches.length) {
            alert("No batches found");
            return;
        }

        data.batches.forEach(batch => {
            const option = document.createElement("option");
            option.value = batch.batch_id;
            option.textContent = batch.batch_name;
            batchSelect.appendChild(option);
        });

    } catch (err) {
        console.error(err);
        alert("Error loading batches");
    }
});

/* ==================================================
   FETCH CLASSES BASED ON SELECTED BATCH
================================================== */
document.getElementById("batchSelect").addEventListener("change", async (e) => {
    selectedBatchId = e.target.value;
    const classSelect = document.getElementById("classSelect");

    classSelect.innerHTML = `<option value="">-- Select Class --</option>`;
    classSelect.disabled = true;
    selectedClassId = "";

    if (!selectedBatchId) return;

    try {
        const res = await fetch(`/api/classes/batch/${encodeURIComponent(selectedBatchId)}`);
        const data = await res.json();
        console.log("Data received:", data);
        console.log("Classes array:", data.class);
        if (!data.success || !data.class) {
            const option = document.createElement("option");
            option.value = "";
            option.textContent = "No classes available";
            classSelect.appendChild(option);
            return;
    }
        const classesArray = [data.class];
        classesArray.forEach(cls => {
            console.log(cls);
            const option = document.createElement("option");
            option.value = cls.class_id;
            option.textContent = cls.topic + " on " + cls.class_date + " at " + cls.class_time;
            classSelect.appendChild(option);
        });

        classSelect.disabled = false;

    } catch (err) {
        console.error(err);
        alert("Error loading classes");
    }
});

/* ==================================================
   FETCH SELECTED CLASS
================================================== */
document.getElementById("classSelect").addEventListener("change", (e) => {
    selectedClassId = e.target.value;
    console.log("Selected Class ID:", selectedClassId);
});

/* ==================================================
   DELETE CLASS
================================================== */
document.getElementById("deleteClassForm").addEventListener("submit", async e => {
    e.preventDefault();

    if (!selectedBatchId || !selectedClassId) {
        alert("Please select batch and class");
        return;
    }

    if (!confirm("Are you sure you want to delete this class?")) return;

    try {
        const res = await fetch(`/api/classes/${encodeURIComponent(selectedClassId)}`, {
            method: "DELETE"
        });

        const data = await res.json();
        alert(data.message);

        if (data.success) {
            window.location.href = "admin_dashboard.html";
        }

    } catch (err) {
        console.error(err);
        alert("Error deleting class");
    }
});
</script>
</body>
</html>
