<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elumalai's Chemistry Academy | Delete Notification</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="grant_access.css">
    <link rel="icon" href="img/logo.png" type="image/x-icon">
</head>
<body>

<!-- ===== Header ===== -->
<header>
    <nav class="navbar">
        <div class="logo">
            <img src="img/logo.png" alt="ECA Logo">
            <span>Elumalai's Chemistry Academy</span>
        </div>

        <button class="menu-toggle" onclick="toggleMenu()">☰</button>

        <ul class="nav-links" id="navLinks">
            <li><a href="admin_dashboard.html">Dashboard</a></li>
            <li><a href="create-batch.html">Create Batch</a></li>
            <li><a href="grant_access.html">Grant Access</a></li>
            <li><a class="active" href="#">Delete Notification</a></li>
            <li><a href="student-login.html">Logout</a></li>
        </ul>
    </nav>
</header>

<!-- ===== Delete Notification Form ===== -->
<div class="auth-container">
    <div class="auth-box">
        <h2>Delete Notification</h2>

        <form id="deleteNotificationForm">

    <!-- Notification Dropdown -->
    <div class="form-group">
        <label>Select Notification</label>
        <select id="notificationSelect" required>
            <option value="">-- Select Notification --</option>
        </select>
    </div>
    <button type="submit" class="btn" style="background:#dc3545">
        Delete Notification
    </button>
    </form>

    </div>
</div>

<!-- ===== Footer ===== -->
<footer>
    <p> For Queries, contact: 9840608224 | Email: elumalaiphd@gmail.com</p>
    © 2026 Elumalai's Chemistry Academy. All Rights Reserved.
</footer>

<script>
/* ===== Mobile Menu ===== */
function toggleMenu() {
    document.getElementById("navLinks").classList.toggle("show");
}

let selectedNotificationId = "";

/* ==================================================
   FETCH ALL NOTIFICATIONS ON PAGE LOAD
================================================== */
document.addEventListener("DOMContentLoaded", async () => {
    const select = document.getElementById("notificationSelect");

    try {
        const res = await fetch("/api/notifications");
        const data = await res.json();

        if (!data.success || !data.notifications.length) {
            alert("No notifications found");
            return;
        }
        console.log(data.notifications);

        data.notifications.forEach(notification => {
            const option = document.createElement("option");
            option.value = notification.notification_id;
            option.textContent = `${notification.description}`;
            select.appendChild(option);
        });

    } catch (err) {
        console.error(err);
        alert("Error loading notifications");
    }
});

/* ==================================================
   FETCH SELECTED NOTIFICATION DETAILS
================================================== */
document.getElementById("notificationSelect").addEventListener("change", (e) => {
    selectedNotificationId = e.target.value;

    console.log("Auto-fetched Notification ID:", selectedNotificationId);
});

/* ==================================================
   DELETE NOTIFICATION
================================================== */
document.getElementById("deleteNotificationForm").addEventListener("submit", async e => {
    e.preventDefault();

    if (!selectedNotificationId) {
        alert("Please select a notification");
        return;
    }

    if (!confirm("Are you sure you want to delete this notification?")) return;

    try {
        const res = await fetch(`/api/notifications/${encodeURIComponent(selectedNotificationId)}`, {
            method: "DELETE"
        });

        const data = await res.json();
        alert(data.message);

        if (data.success) {
            window.location.href = "admin_dashboard.html";
        }

    } catch (err) {
        console.error(err);
        alert("Error deleting notification");
    }
});
</script>
</body>
</html>
