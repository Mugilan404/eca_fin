<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Notification</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="grant_access.css" />
  <link rel="icon" href="img/logo.png" type="image/x-icon" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    .container {
      max-width: 500px;
      background: #fff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 450px;
    margin: 60px auto;
    padding: 25px;
    background-color: rgba(255, 255, 255, 0.95);
    box-shadow: 0 0 15px rgba(0,0,0,0.3);
    border-radius: 12px;
    }

    h2 {
      margin-bottom: 20px;
      text-align: center;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
    }

    textarea, input {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
<!-- ===== Header ===== -->
<header>
  <nav class="navbar">
    <div class="logo">
      <img src="img/logo.png" alt="ECA Logo">
      <span>Elumalai's Chemistry Academy</span>
    </div>

    <button class="menu-toggle" onclick="toggleMenu()">☰</button>

    <ul class="nav-links" id="navLinks">
      <li><a href="admin_dashboard.html">Dashboard</a></li>
      <li><a href="create-batch.html">Create Batch</a></li>
      <li><a class="active" href="create_notification.html">Create Notification</a></li>
      <li><a href="student-login.html">Logout</a></li>
    </ul>
  </nav>
</header>
<div class="container">
  <h2>Create Notification</h2>

  <form id="notificationForm">
    <label>Description</label>
    <textarea id="description" rows="4" required></textarea>

    <label>URL (optional)</label>
    <input type="url" id="url" placeholder="https://example.com">

    <button type="submit">Post Notification</button>
  </form>
</div>
<footer>
  <p> For Queries, contact: 9840608224 | Email: elumalaiphd@gmail.com</p>
  © 2026 Elumalai's Chemistry Academy. All Rights Reserved.
</footer>
<script>
  document.getElementById("notificationForm").addEventListener("submit", async e => {
    e.preventDefault();

    const payload = {
      description: document.getElementById("description").value.trim(),
      url: document.getElementById("url").value.trim()
    };

    if (!payload.description) {
      alert("Description is required");
      return;
    }

    const res = await fetch("/api/notifications", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await res.json();
    alert(data.message);
    window.location.href("admin_dashboard.html");
    if (data.success) {
      document.getElementById("notificationForm").reset();
    }
  });
</script>

</body>
</html>
